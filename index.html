<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdf8f6">
<title>گیسو | GISOO — فروشگاه تخصصی محصولات آرایشی، بهداشتی و عطر</title>
<meta name="description" content="گیسو، فروشگاه تخصصی محصولات آرایشی، بهداشتی، مراقبت پوست و مو و عطر و ادکلن. خرید آنلاین برندهای معتبر جهان با ضمانت اصالت کالا.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ======= SVG SPRITE ======= -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 5.6a5.2 5.2 0 0 0-7.4 0L12 7l-1.4-1.4a5.2 5.2 0 0 0-7.4 7.4L12 21l8.8-8a5.2 5.2 0 0 0 0-7.4Z"/></symbol>
  <symbol id="i-bag" viewBox="0 0 24 24"><path d="M6 8h12l1 12H5L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-arrow-l" viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></symbol>
  <symbol id="i-arrow-r" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9L12 3Z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13M10 11v6M14 11v6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 13 4 4L19 7"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 5 6v6c0 4.5 3 7.6 7 9 4-1.4 7-4.5 7-9V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></symbol>
  <symbol id="i-truck" viewBox="0 0 24 24"><path d="M3 7h11v10H3zM14 10h4l3 3v4h-7z"/><circle cx="7" cy="18" r="1.6"/><circle cx="17.5" cy="18" r="1.6"/></symbol>
  <symbol id="i-return" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/></symbol>
  <symbol id="i-gift" viewBox="0 0 24 24"><path d="M4 10h16v10H4zM4 10V7h16v3M12 7v13"/><path d="M12 7S9.5 3 7.5 4.5 9 7 12 7s4.5-1 2.5-2.5S12 7 12 7Z"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-headset" viewBox="0 0 24 24"><path d="M4 13a8 8 0 0 1 16 0"/><rect x="3" y="13" width="4" height="6" rx="1.5"/><rect x="17" y="13" width="4" height="6" rx="1.5"/><path d="M19 19a4 4 0 0 1-4 3h-2"/></symbol>
  <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3v5M12 16v5M3 12h5M16 12h5M6 6l3 3M15 15l3 3M18 6l-3 3M9 15l-3 3"/></symbol>
  <symbol id="i-compare" viewBox="0 0 24 24"><path d="M4 7h7M4 17h7M17 4v16M13 8l4-4 4 4"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.6"/></symbol>
  <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="m4 11 8-7 8 7v9H4v-9Z"/><path d="M10 20v-6h4v6"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-percent" viewBox="0 0 24 24"><path d="M6 18 18 6"/><circle cx="7.5" cy="7.5" r="2.5"/><circle cx="16.5" cy="16.5" r="2.5"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A15 15 0 0 1 3 6a2 2 0 0 1 2-2Z"/></symbol>
  <symbol id="i-instagram" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".9" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
  <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M5 19c0-8 5-13 14-14 1 9-4 15-11 15H5Z"/><path d="M9 15c2-3 5-5.5 8-6.5"/></symbol>
  <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3s6 6.4 6 10.4A6 6 0 0 1 6 13.4C6 9.4 12 3 12 3Z"/></symbol>
  <symbol id="i-heart-fill" viewBox="0 0 24 24"><path d="M20.8 5.6a5.2 5.2 0 0 0-7.4 0L12 7l-1.4-1.4a5.2 5.2 0 0 0-7.4 7.4L12 21l8.8-8a5.2 5.2 0 0 0 0-7.4Z" fill="currentColor"/></symbol>
</svg>

<!-- ======= ANNOUNCEMENT BAR ======= -->
<div class="announce" id="announce">
  <div class="announce__track">
    <span class="announce__item"><svg class="ic"><use href="#i-truck"/></svg> ارسال رایگان برای خرید بالای ۲٫۰۰۰٫۰۰۰ تومان</span>
    <span class="announce__dot"></span>
    <span class="announce__item"><svg class="ic"><use href="#i-shield"/></svg> ضمانت اصالت تمامی محصولات</span>
    <span class="announce__dot"></span>
    <span class="announce__item"><svg class="ic"><use href="#i-gift"/></svg> اشانتیون ویژه در سفارش‌های منتخب</span>
    <span class="announce__dot"></span>
    <span class="announce__item"><svg class="ic"><use href="#i-return"/></svg> ۷ روز ضمانت بازگشت کالا</span>
  </div>
</div>

<!-- ======= HEADER ======= -->
<header class="header" id="header">
  <div class="container header__inner">
    <button class="icon-btn header__burger" id="openMenu" aria-label="منو">
      <svg class="ic"><use href="#i-menu"/></svg>
    </button>

    <a href="#/" class="brand" aria-label="گیسو">
      <span class="brand__logo">
        <img src="logo.png" alt="نشان گیسو" width="44" height="44">
      </span>
      <span class="brand__text">
        <span class="brand__en">GISOO</span>
        <span class="brand__fa">گیسو</span>
      </span>
    </a>

    <form class="search" id="searchForm" role="search" autocomplete="off">
      <svg class="ic search__ic"><use href="#i-search"/></svg>
      <input id="searchInput" type="search" placeholder="جستجوی محصول، برند یا دسته‌بندی…" aria-label="جستجوی محصولات">
      <button type="submit" class="search__btn">جستجو</button>
      <div class="search__drop" id="searchDrop" hidden></div>
    </form>

    <nav class="header__actions">
      <a href="#/wishlist" class="icon-btn icon-btn--text" data-nav="wishlist" aria-label="علاقه‌مندی‌ها">
        <svg class="ic"><use href="#i-heart"/></svg>
        <span class="icon-btn__label">علاقه‌مندی</span>
        <span class="badge" data-count="wish">۰</span>
      </a>
      <button class="icon-btn icon-btn--text" id="openCart" aria-label="سبد خرید">
        <svg class="ic"><use href="#i-bag"/></svg>
        <span class="icon-btn__label">سبد خرید</span>
        <span class="badge" data-count="cart">۰</span>
      </button>
      <a href="#/compare" class="icon-btn icon-btn--text" data-nav="compare" aria-label="مقایسه">
        <svg class="ic"><use href="#i-compare"/></svg>
        <span class="icon-btn__label">مقایسه</span>
        <span class="badge badge--soft" data-count="compare">۰</span>
      </a>
    </nav>
  </div>

  <div class="navrow" id="navrow">
    <div class="container navrow__inner">
      <div class="mega" data-mega>
        <button class="mega__trigger" id="megaTrigger">
          <svg class="ic"><use href="#i-grid"/></svg>
          دسته‌بندی محصولات
          <svg class="ic ic--sm mega__arrow"><use href="#i-chevron-down"/></svg>
        </button>
        <div class="mega__panel" id="megaPanel"></div>
      </div>
      <nav class="navlinks" id="navlinks"></nav>
    </div>
  </div>
</header>

<main id="app"></main>

<!-- ======= FOOTER ======= -->
<footer class="footer" id="footer"></footer>

<!-- ======= MOBILE TABBAR ======= -->
<nav class="tabbar" id="tabbar">
  <a href="#/" data-tab="home"><svg class="ic"><use href="#i-home"/></svg><span>خانه</span></a>
  <a href="#/shop" data-tab="shop"><svg class="ic"><use href="#i-grid"/></svg><span>فروشگاه</span></a>
  <a href="#/search" data-tab="search"><svg class="ic"><use href="#i-search"/></svg><span>جستجو</span></a>
  <a href="#/wishlist" data-tab="wishlist"><svg class="ic"><use href="#i-heart"/></svg><span>علاقه‌مندی</span><span class="badge badge--tab" data-count="wish">۰</span></a>
  <a href="#/cart" data-tab="cart"><svg class="ic"><use href="#i-bag"/></svg><span>سبد</span><span class="badge badge--tab" data-count="cart">۰</span></a>
</nav>

<!-- ======= DRAWERS / OVERLAYS ======= -->
<div class="scrim" id="scrim" hidden></div>

<aside class="drawer drawer--menu" id="menuDrawer" aria-hidden="true">
  <div class="drawer__head">
    <span class="drawer__title">منوی گیسو</span>
    <button class="icon-btn" data-close aria-label="بستن"><svg class="ic"><use href="#i-close"/></svg></button>
  </div>
  <div class="drawer__body" id="menuDrawerBody"></div>
</aside>

<aside class="drawer drawer--cart" id="cartDrawer" aria-hidden="true">
  <div class="drawer__head">
    <span class="drawer__title">سبد خرید</span>
    <button class="icon-btn" data-close aria-label="بستن"><svg class="ic"><use href="#i-close"/></svg></button>
  </div>
  <div class="drawer__body" id="cartDrawerBody"></div>
  <div class="drawer__foot" id="cartDrawerFoot"></div>
</aside>

<div class="toast-wrap" id="toastWrap"></div>
<div class="comparebar" id="compareBar" hidden></div>

<script src="script.js"></script>
</body>
</html>
